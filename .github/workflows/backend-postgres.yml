name: Backend PostgreSQL integration

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres.yml"

permissions:
  contents: read

concurrency:
  group: backend-postgres-integration
  cancel-in-progress: false

jobs:
  postgres-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backend-integration-test
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_TEST_DATABASE_URL: ${{ secrets.POSTGRES_TEST_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      POSTGRES_TEST_ENDPOINT_ID: ${{ secrets.POSTGRES_TEST_ENDPOINT_ID }}
      POSTGRES_TEST_BRANCH_NAME: backend-integration-test
      ALLOW_DESTRUCTIVE_POSTGRES_TESTS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate dedicated PostgreSQL test environment
        run: >-
          python -c "from test_support.postgres_safety import
          validate_postgres_test_environment as validate;
          validate(require_migration=True, require_destructive=True)"

      - name: Run PostgreSQL integration gate
        run: python -m pytest -m "postgres or migration or concurrency"
