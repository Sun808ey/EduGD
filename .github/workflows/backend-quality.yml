name: Backend quality

on:
  push:
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy app test_support

      - name: Test with coverage
        run: >-
          python -m pytest
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt --strict

      - name: Scan Python security issues
        run: python -m bandit -r app test_support -c pyproject.toml -ll
