name: Frontend quality
on:
  push:
    paths: ["frontend/school-policy-admin/**", ".github/workflows/frontend-quality.yml"]
  pull_request:
    paths: ["frontend/school-policy-admin/**", ".github/workflows/frontend-quality.yml"]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/school-policy-admin
    env:
      # Reserved, non-routable example: never deploy this CI artifact.
      VITE_API_BASE_URL: https://api.example.invalid/api/v1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/school-policy-admin/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate
