name: Android DPC quality

on:
  push:
    paths:
      - "android-dpc/**"
      - ".github/workflows/android-dpc-quality.yml"
  pull_request:
    paths:
      - "android-dpc/**"
      - ".github/workflows/android-dpc-quality.yml"

permissions:
  contents: read

concurrency:
  group: android-dpc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_KEYSTORE_PASSWORD: temporary-ci-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run lint, unit tests, and debug build
        run: ./gradlew -p android-dpc --no-daemon lint testDebugUnitTest assembleDebug

      - name: Create disposable release keystore
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/edugd-ci-release.p12" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEYSTORE_PASSWORD" \
            -alias edugd-ci -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=EduG CI,OU=CI,O=EduG,L=Kampala,C=UG"
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/edugd-ci-release.p12" \
            "storePassword=$CI_KEYSTORE_PASSWORD" \
            "keyAlias=edugd-ci" \
            "keyPassword=$CI_KEYSTORE_PASSWORD" \
            > android-dpc/keystore.properties

      - name: Build minified release APK
        run: ./gradlew -p android-dpc --no-daemon assembleRelease

      - name: Verify release APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android-dpc/app/build/outputs/apk/release/app-release.apk

      - name: Remove disposable signing material
        if: ${{ always() }}
        run: |
          rm -f android-dpc/keystore.properties
          rm -f "$RUNNER_TEMP/edugd-ci-release.p12"
