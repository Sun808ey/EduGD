# No host ports, hosted secrets or external network at test runtime.
# This Supabase-shaped hostname is only an isolated Docker DNS alias allowing
# the existing strict identity/TLS checks to run against ordinary PostgreSQL.
name: edug-disposable-postgres
services:
  certificates:
    build:
      context: .
      dockerfile: test_support/disposable/Dockerfile
    command: python -m test_support.disposable.certificates
    volumes:
      - certificates:/certs
    networks: [isolated]
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: edug_test
      POSTGRES_PASSWORD: ${EDUG_DISPOSABLE_POSTGRES_TOKEN:?required}
      POSTGRES_DB: edug_test
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/certs/server.crt, -c, ssl_key_file=/certs/server.key]
    depends_on:
      certificates:
        condition: service_completed_successfully
    volumes:
      - certificates:/certs:ro
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      isolated:
        aliases: [db.eduglocaltest0000001.supabase.co]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U edug_test -d edug_test]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: test_support/disposable/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_TEST_DATABASE_URL: postgresql://edug_test:${EDUG_DISPOSABLE_POSTGRES_TOKEN:?required}@db.eduglocaltest0000001.supabase.co:5432/edug_test?sslmode=verify-full&sslrootcert=/certs/server.crt
      MIGRATION_DATABASE_URL: postgresql://edug_test:${EDUG_DISPOSABLE_POSTGRES_TOKEN:?required}@db.eduglocaltest0000001.supabase.co:5432/edug_test?sslmode=verify-full&sslrootcert=/certs/server.crt
      POSTGRES_TEST_PROJECT_REF: eduglocaltest0000001
      POSTGRES_TEST_PURPOSE: backend-integration-test
      ALLOW_DESTRUCTIVE_POSTGRES_TESTS: "true"
    volumes:
      - certificates:/certs:ro
    networks: [isolated]
networks:
  isolated:
    internal: true
volumes:
  certificates:
